<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Tail ending in a heart shape -->
  <!-- Stem line -->
  <path d="M 110 170 Q 120 140 130 110" fill="none" stroke="#8B4513" stroke-width="8" stroke-linecap="round" class="stroke"/>
  <!-- Heart shape -->
  <path d="M 130 110 C 130 95 110 85 110 100 C 110 110 130 120 130 130" fill="#FF3B8D" class="stroke"/>
  <path d="M 130 110 C 130 95 150 85 150 100 C 150 110 130 120 130 130" fill="#FF3B8D" class="stroke"/>
  <!-- Heart highlight -->
  <circle cx="120" cy="98" r="3" fill="#FFFFFF" opacity="0.5"/>
