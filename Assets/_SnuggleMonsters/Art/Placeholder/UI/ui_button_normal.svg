<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Friendly rounded rectangle button - cyan, 'OK' text -->
  <!-- Button body -->
  <rect x="10" y="10" width="180" height="80" rx="20" ry="20" fill="#00E5FF" stroke="#000000" stroke-width="3"/>
  <!-- Inner highlight -->
  <rect x="15" y="15" width="170" height="35" rx="15" ry="15" fill="#00F5FF" stroke="none"/>
  <!-- Text 'OK' -->
  <text x="100" y="65" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" text-anchor="middle">OK</text>
  <!-- Subtle shine -->
  <ellipse cx="70" cy="35" rx="30" ry="8" fill="rgba(255,255,255,0.3)" transform="rotate(-10,70,35)"/>
</svg>