<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Highlighted button - bright yellow with orange outline and glow effect -->
  <!-- Glow halo -->
  <rect x="5" y="5" width="190" height="90" rx="25" ry="25" fill="#FFD93D" opacity="0.3"/>
  <rect x="3" y="3" width="194" height="94" rx="27" ry="27" fill="#FFD93D" opacity="0.15"/>
  <!-- Button body -->
  <rect x="10" y="10" width="180" height="80" rx="20" ry="20" fill="#FFD93D" stroke="#FF8C00" stroke-width="4"/>
  <!-- Inner highlight -->
  <rect x="15" y="15" width="170" height="35" rx="15" ry="15" fill="#FFE44D" stroke="none"/>
  <!-- Text 'OK' -->
  <text x="100" y="65" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#333333" stroke="#000000" stroke-width="1.5" text-anchor="middle">OK</text>
  <!-- Bright shine -->
  <ellipse cx="65" cy="35" rx="35" ry="10" fill="rgba(255,255,255,0.4)" transform="rotate(-8,65,35)"/>
</svg>