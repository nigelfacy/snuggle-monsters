<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Stack of 4 colourful books at a slight angle -->
  <g transform="rotate(-5, 100, 100)">
    <!-- Book 1 - Red (bottom) -->
    <rect x="30" y="130" width="130" height="30" rx="4" fill="#FF6B6B" stroke="#000000" stroke-width="3"/>
    <line x1="42" y1="130" x2="42" y2="160" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="50" y1="130" x2="50" y2="160" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="58" y1="130" x2="58" y2="160" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Book 2 - Cyan -->
    <rect x="35" y="102" width="120" height="28" rx="4" fill="#00E5FF" stroke="#000000" stroke-width="3"/>
    <line x1="45" y1="102" x2="45" y2="130" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="53" y1="102" x2="53" y2="130" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Book 3 - Yellow -->
    <rect x="42" y="76" width="108" height="26" rx="4" fill="#FFD93D" stroke="#000000" stroke-width="3"/>
    <line x1="52" y1="76" x2="52" y2="102" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Book 4 - Purple (top) -->
    <rect x="50" y="52" width="95" height="24" rx="4" fill="#A855F7" stroke="#000000" stroke-width="3"/>
    <line x1="60" y1="52" x2="60" y2="76" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>