<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cozy blanket with sleeping monster face - soft pink -->
  <!-- Blanket body - slightly wavy rectangular -->
  <path d="M15,20 L185,20 C190,20 192,25 190,35 L190,165 C190,175 188,180 185,180 L15,180 C12,180 10,175 10,165 L10,35 C8,25 10,20 15,20 Z" fill="#FFA6C9" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wavy blanket edge (top) -->
  <path d="M15,20 C40,28 60,12 85,20 C110,28 130,12 155,20 C170,25 178,22 185,20" fill="none" stroke="#FF85B3" stroke-width="3" stroke-linecap="round"/>
  <!-- Stitching lines around edge -->
  <path d="M25,30 L175,30 M25,170 L175,170 M20,35 L20,165 M180,35 L180,165" fill="none" stroke="#FF85B3" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>
  <!-- Sleeping monster face -->
  <!-- Head -->
  <ellipse cx="100" cy="100" rx="45" ry="35" fill="#FF85B3" stroke="#000000" stroke-width="3"/>
  <!-- Closed eyes - crescent shapes -->
  <path d="M75,90 C80,82 90,82 95,90" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M105,90 C110,82 120,82 125,90" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Tiny sleeping smile -->
  <path d="M90,110 Q100,115 110,110" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Blush cheeks -->
  <ellipse cx="70" cy="105" rx="8" ry="5" fill="#FF6B9D" opacity="0.5"/>
  <ellipse cx="130" cy="105" rx="8" ry="5" fill="#FF6B9D" opacity="0.5"/>
  <!-- Little Zzz -->
  <text x="125" y="78" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4DABF7">z</text>
  <text x="135" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4DABF7">z</text>
  <text x="142" y="60" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4DABF7">z</text>
  <!-- Small horns -->
  <path d="M65,70 L58,55 L70,65" fill="#A855F7" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M135,70 L142,55 L130,65" fill="#A855F7" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
</svg>