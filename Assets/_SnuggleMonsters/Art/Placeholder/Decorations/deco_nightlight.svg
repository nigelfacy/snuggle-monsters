<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Glowing star night light with warm halo -->
  <!-- Halo layers -->
  <circle cx="100" cy="90" r="85" fill="#FFEAA7" opacity="0.2"/>
  <circle cx="100" cy="90" r="70" fill="#FFEAA7" opacity="0.3"/>
  <circle cx="100" cy="90" r="55" fill="#FFEAA7" opacity="0.4"/>
  <!-- Star shape -->
  <polygon points="100,20 115,60 158,65 125,95 133,140 100,118 67,140 75,95 42,65 85,60" fill="#FFD700" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Star inner shine -->
  <polygon points="100,35 110,62 140,65 118,86 123,115 100,102 77,115 82,86 60,65 90,62" fill="#FFF3BF" stroke="none"/>
  <!-- Warm glow centre -->
  <ellipse cx="100" cy="85" rx="15" ry="10" fill="#FFFFAA" opacity="0.6"/>
  <!-- Sparkles -->
  <circle cx="50" cy="45" r="3" fill="#FFD700" stroke="#000000" stroke-width="1.5"/>
  <line x1="50" y1="38" x2="50" y2="52" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="45" x2="57" y2="45" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="150" cy="50" r="2" fill="#FFD700" stroke="#000000" stroke-width="1.5"/>
  <circle cx="40" cy="130" r="2" fill="#FFD700" stroke="#000000" stroke-width="1.5"/>
  <circle cx="160" cy="120" r="3" fill="#FFD700" stroke="#000000" stroke-width="1.5"/>
  <line x1="160" y1="113" x2="160" y2="127" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="153" y1="120" x2="167" y2="120" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cute face on star -->
  <circle cx="90" cy="80" r="4" fill="#333" stroke="none"/>
  <circle cx="110" cy="80" r="4" fill="#333" stroke="none"/>
  <path d="M93,90 Q100,96 107,90" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>