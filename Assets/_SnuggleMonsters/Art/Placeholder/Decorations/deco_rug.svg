<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Round fluffy oval rug - top-down view. Cyan/teal with star centre and zigzag border -->
  <!-- Outer zigzag ring -->
  <polygon points="100,10 110,30 125,18 120,40 140,32 130,52 148,50 135,65 155,68 138,80 158,85 140,95 160,100 140,105 158,115 138,120 155,132 135,135 148,148 130,148 140,168 120,160 125,182 110,170 100,190 90,170 75,182 80,160 60,168 70,148 52,148 65,135 45,132 62,120 42,115 60,105 42,100 60,95 40,85 62,80 45,68 65,65 52,50 70,52 60,32 80,40 75,18 90,30" fill="#20C997" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Inner oval -->
  <ellipse cx="100" cy="100" rx="72" ry="72" fill="#20C997" stroke="#000000" stroke-width="3"/>
  <!-- Lighter inner ring -->
  <ellipse cx="100" cy="100" rx="55" ry="55" fill="#38D9A9" stroke="#000000" stroke-width="3"/>
  <!-- Centre star -->
  <polygon points="100,52 108,72 130,72 113,86 119,108 100,95 81,108 87,86 70,72 92,72" fill="#FFD700" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Star shine -->
  <circle cx="100" cy="70" r="4" fill="#FFF3BF" stroke="none"/>
  <!-- Decorative dots -->
  <circle cx="60" cy="60" r="4" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <circle cx="140" cy="60" r="4" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <circle cx="60" cy="140" r="4" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <circle cx="140" cy="140" r="4" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <!-- Fluffy texture lines -->
  <path d="M30,100 C25,95 25,105 30,100" fill="none" stroke="#1EA37E" stroke-width="2" stroke-linecap="round"/>
  <path d="M170,100 C175,95 175,105 170,100" fill="none" stroke="#1EA37E" stroke-width="2" stroke-linecap="round"/>
  <path d="M100,25 C95,20 105,20 100,25" fill="none" stroke="#1EA37E" stroke-width="2" stroke-linecap="round"/>
  <path d="M100,175 C95,180 105,180 100,175" fill="none" stroke="#1EA37E" stroke-width="2" stroke-linecap="round"/>
</svg>