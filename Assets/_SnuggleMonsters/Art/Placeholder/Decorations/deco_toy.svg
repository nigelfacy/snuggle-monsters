<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Stack of colourful building blocks tower -->
  <!-- Bottom block - Yellow -->
  <rect x="45" y="138" width="80" height="40" rx="6" fill="#FFD93D" stroke="#000000" stroke-width="3"/>
  <!-- Block letter 'A' on bottom -->
  <text x="85" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">A</text>
  <!-- Second block - Green -->
  <rect x="50" y="100" width="70" height="38" rx="6" fill="#51CF66" stroke="#000000" stroke-width="3"/>
  <!-- Block letter 'B' -->
  <text x="85" y="127" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">B</text>
  <!-- Third block - Blue -->
  <rect x="58" y="65" width="60" height="35" rx="6" fill="#4DABF7" stroke="#000000" stroke-width="3"/>
  <!-- Block letter 'C' -->
  <text x="88" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">C</text>
  <!-- Top block - Red -->
  <rect x="68" y="35" width="48" height="30" rx="6" fill="#FF6B6B" stroke="#000000" stroke-width="3"/>
  <!-- Block letter 'D' -->
  <text x="92" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">D</text>
  <!-- Face on bottom block -->
  <circle cx="70" cy="152" r="3" fill="#333"/>
  <circle cx="95" cy="152" r="3" fill="#333"/>
  <path d="M73,160 Q82,167 92,160" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>