<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Wall poster with star motif - rectangular rounded corners -->
  <!-- Poster frame -->
  <rect x="15" y="10" width="170" height="180" rx="12" fill="#E3F2FD" stroke="#000000" stroke-width="3"/>
  <!-- Inner border -->
  <rect x="28" y="23" width="144" height="154" rx="8" fill="none" stroke="#4DABF7" stroke-width="2"/>
  <!-- Big gold star in centre -->
  <polygon points="100,40 112,72 148,75 120,98 129,135 100,115 71,135 80,98 52,75 88,72" fill="#FFD700" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Star inner highlight -->
  <polygon points="100,52 108,72 125,74 108,90 113,110 100,100 87,110 92,90 75,74 92,72" fill="#FFF3BF" stroke="none"/>
  <!-- Sparkle dots around -->
  <!-- Top left -->
  <circle cx="45" cy="45" r="4" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <line x1="45" y1="37" x2="45" y2="53" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="45" x2="53" y2="45" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <!-- Top right -->
  <circle cx="155" cy="55" r="3" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <!-- Bottom left -->
  <circle cx="40" cy="150" r="3" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <!-- Bottom right -->
  <circle cx="160" cy="145" r="4" fill="#FFD700" stroke="#000000" stroke-width="2"/>
  <line x1="160" y1="137" x2="160" y2="153" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="145" x2="168" y2="145" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <!-- Tiny stars -->
  <polygon points="60,60 63,68 72,68 65,73 67,82 60,77 53,82 55,73 48,68 57,68" fill="#FFD700" stroke="#000000" stroke-width="1.5"/>
  <polygon points="145,95 147,100 153,100 148,103 150,109 145,106 140,109 142,103 137,100 143,100" fill="#FFD700" stroke="#000000" stroke-width="1.5"/>
</svg>