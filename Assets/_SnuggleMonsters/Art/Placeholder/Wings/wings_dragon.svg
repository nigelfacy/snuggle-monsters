  <path d="M 90 100 C 75 75 55 50 30 35" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <path d="M 90 100 C 80 80 65 58 45 40" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <!-- Right wing vein lines -->
  <path d="M 110 100 C 130 80 160 50 180 35" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <path d="M 110 100 C 125 75 145 50 170 35" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
  <path d="M 110 100 C 120 80 135 58 155 40" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
