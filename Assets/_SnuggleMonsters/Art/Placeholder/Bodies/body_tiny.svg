<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Small round body / oversized head -->
  <ellipse cx="100" cy="100" rx="60" ry="70" fill="#FFD700" class="stroke"/>
  <!-- Giant eye space -->
  <ellipse cx="100" cy="85" rx="35" ry="30" fill="#FFFFFF" class="stroke"/>
  <!-- Tiny nub legs -->
  <rect x="75" y="160" width="14" height="18" rx="7" ry="7" fill="#FFD700" class="stroke"/>
  <rect x="111" y="160" width="14" height="18" rx="7" ry="7" fill="#FFD700" class="stroke"/>
  <!-- Tiny nub arms -->
  <rect x="22" y="95" width="20" height="14" rx="7" ry="7" fill="#FFD700" class="stroke"/>
  <rect x="158" y="95" width="20" height="14" rx="7" ry="7" fill="#FFD700" class="stroke"/>
  <!-- Friendly smile -->
  <path d="M 80 130 Q 100 148 120 130" fill="none" class="stroke"/>
  <!-- Blush -->
  <circle cx="70" cy="115" r="7" fill="#FF3B8D" opacity="0.4"/>
  <circle cx="130" cy="115" r="7" fill="#FF3B8D" opacity="0.4"/>
</svg>