<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Body shape -->
  <rect x="25" y="30" width="150" height="140" rx="60" ry="60" fill="#00E5FF" class="stroke"/>
  <!-- Dark purple spots -->
  <circle cx="60" cy="70" r="8" fill="#4A0080" opacity="0.6"/>
  <circle cx="130" cy="55" r="10" fill="#4A0080" opacity="0.6"/>
  <circle cx="100" cy="100" r="6" fill="#4A0080" opacity="0.6"/>
  <circle cx="145" cy="105" r="7" fill="#4A0080" opacity="0.6"/>
  <circle cx="55" cy="125" r="5" fill="#4A0080" opacity="0.6"/>
  <circle cx="80" cy="145" r="9" fill="#4A0080" opacity="0.6"/>
  <circle cx="120" cy="140" r="6" fill="#4A0080" opacity="0.6"/>
  <circle cx="155" cy="70" r="5" fill="#4A0080" opacity="0.6"/>
  <!-- Left stubby arm -->
  <rect x="5" y="85" width="25" height="35" rx="15" ry="15" fill="#00E5FF" class="stroke"/>
  <!-- Right stubby arm -->
  <rect x="170" y="85" width="25" height="35" rx="15" ry="15" fill="#00E5FF" class="stroke"/>
  <!-- Friendly smile -->
  <path d="M 75 130 Q 100 160 125 130" fill="none" class="stroke"/>
  <!-- Blush circles -->
  <circle cx="65" cy="115" r="8" fill="#FF69B4" opacity="0.5"/>
  <circle cx="135" cy="115" r="8" fill="#FF69B4" opacity="0.5"/>
</svg>