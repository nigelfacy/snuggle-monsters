<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Cloud-shaped body (overlapping circles) -->
  <circle cx="70" cy="85" r="35" fill="#FF69B4" class="stroke"/>
  <circle cx="130" cy="85" r="35" fill="#FF69B4" class="stroke"/>
  <circle cx="100" cy="70" r="40" fill="#FF69B4" class="stroke"/>
  <circle cx="65" cy="120" r="30" fill="#FF69B4" class="stroke"/>
  <circle cx="135" cy="120" r="30" fill="#FF69B4" class="stroke"/>
  <circle cx="100" cy="130" r="35" fill="#FF69B4" class="stroke"/>
  <!-- Cloud top bumps -->
  <circle cx="55" cy="70" r="20" fill="#FF69B4" class="stroke"/>
  <circle cx="145" cy="70" r="20" fill="#FF69B4" class="stroke"/>
  <circle cx="100" cy="50" r="25" fill="#FF69B4" class="stroke"/>
  <!-- Sleepy half-closed eye area -->
  <ellipse cx="80" cy="90" rx="15" ry="10" fill="#FFFFFF" class="stroke"/>
  <ellipse cx="120" cy="90" rx="15" ry="10" fill="#FFFFFF" class="stroke"/>
  <line x1="68" y1="90" x2="92" y2="90" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <line x1="108" y1="90" x2="132" y2="90" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <!-- Sleepy smile -->
  <path d="M 80 120 Q 100 135 120 120" fill="none" class="stroke"/>
  <!-- Blush -->
  <circle cx="65" cy="110" r="6" fill="#FF3B8D" opacity="0.4"/>
  <circle cx="135" cy="110" r="6" fill="#FF3B8D" opacity="0.4"/>
</svg>