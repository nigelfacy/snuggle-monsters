<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Tall oval body -->
  <ellipse cx="100" cy="100" rx="55" ry="75" fill="#9B59B6" class="stroke"/>
  <!-- Wavy ridges on sides -->
  <path d="M 48 60 Q 55 70 48 80 Q 55 90 48 100 Q 55 110 48 120" fill="none" stroke="#7D3C98" stroke-width="3" stroke-linecap="round"/>
  <path d="M 152 60 Q 145 70 152 80 Q 145 90 152 100 Q 145 110 152 120" fill="none" stroke="#7D3C98" stroke-width="3" stroke-linecap="round"/>
  <!-- Three eye slots in a line -->
  <ellipse cx="75" cy="80" rx="14" ry="16" fill="#FFFFFF" class="stroke"/>
  <ellipse cx="100" cy="80" rx="14" ry="16" fill="#FFFFFF" class="stroke"/>
  <ellipse cx="125" cy="80" rx="14" ry="16" fill="#FFFFFF" class="stroke"/>
  <!-- Long bendy arm shapes -->
  <path d="M 40 95 Q 15 85 20 60 Q 25 45 35 50" fill="none" stroke="#9B59B6" stroke-width="12" stroke-linecap="round" class="stroke"/>
  <path d="M 160 95 Q 185 85 180 60 Q 175 45 165 50" fill="none" stroke="#9B59B6" stroke-width="12" stroke-linecap="round" class="stroke"/>
  <!-- Friendly smile -->
  <path d="M 80 130 Q 100 150 120 130" fill="none" class="stroke"/>
  <!-- Blush -->
  <circle cx="70" cy="115" r="5" fill="#FF69B4" opacity="0.5"/>
  <circle cx="130" cy="115" r="5" fill="#FF69B4" opacity="0.5"/>
</svg>