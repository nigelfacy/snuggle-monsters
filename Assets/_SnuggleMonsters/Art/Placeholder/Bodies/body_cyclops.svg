<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Perfect circle body -->
  <circle cx="100" cy="100" r="70" fill="#39FF14" class="stroke"/>
  <!-- Giant eye space (white circle to be overlayed) -->
  <ellipse cx="100" cy="90" rx="28" ry="32" fill="#FFFFFF" class="stroke"/>
  <!-- Short legs -->
  <rect x="65" y="160" width="20" height="25" rx="10" ry="10" fill="#39FF14" class="stroke"/>
  <rect x="115" y="160" width="20" height="25" rx="10" ry="10" fill="#39FF14" class="stroke"/>
  <!-- Tiny horns on top -->
  <path d="M 75 35 Q 70 15 80 20" fill="#8B4513" class="stroke"/>
  <path d="M 125 35 Q 130 15 120 20" fill="#8B4513" class="stroke"/>
  <!-- Friendly smile -->
  <path d="M 75 125 Q 100 150 125 125" fill="none" class="stroke"/>
  <!-- Blush -->
  <circle cx="65" cy="110" r="6" fill="#FF69B4" opacity="0.5"/>
  <circle cx="135" cy="110" r="6" fill="#FF69B4" opacity="0.5"/>
</svg>