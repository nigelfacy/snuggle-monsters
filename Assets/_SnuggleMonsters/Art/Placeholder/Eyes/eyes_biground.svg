<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Two large oval eyes side by side -->
  <ellipse cx="70" cy="100" rx="35" ry="40" fill="#FFFFFF" class="stroke"/>
  <ellipse cx="130" cy="100" rx="35" ry="40" fill="#FFFFFF" class="stroke"/>
  <!-- Big black circular pupils -->
  <circle cx="70" cy="100" r="18" fill="#000000"/>
  <circle cx="130" cy="100" r="18" fill="#000000"/>
  <!-- Tiny white highlight dots -->
  <circle cx="62" cy="92" r="5" fill="#FFFFFF"/>
  <circle cx="122" cy="92" r="5" fill="#FFFFFF"/>
  <!-- Cute eyebrows above -->
  <path d="M 45 60 Q 70 45 95 60" fill="none" class="stroke"/>
  <path d="M 105 60 Q 130 45 155 60" fill="none" class="stroke"/>
</svg>