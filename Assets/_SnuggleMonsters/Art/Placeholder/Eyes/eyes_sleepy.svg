<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Two half-lidded oval eyes (cut off flat on top) -->
  <path d="M 55 75 L 55 125 Q 55 140 70 140 Q 85 140 85 125 L 85 75 Z" fill="#FFFFFF" class="stroke"/>
  <path d="M 115 75 L 115 125 Q 115 140 130 140 Q 145 140 145 125 L 145 75 Z" fill="#FFFFFF" class="stroke"/>
  <!-- Black crescent pupils -->
  <path d="M 60 105 Q 70 120 80 105" fill="#000000" class="stroke"/>
  <path d="M 120 105 Q 130 120 140 105" fill="#000000" class="stroke"/>
  <!-- Droopy eyebrows -->
  <path d="M 50 65 L 90 75" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 110 75 L 150 65" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Sleepy drops -->
  <circle cx="90" cy="78" r="2" fill="#000000"/>
  <circle cx="110" cy="78" r="2" fill="#000000"/>
</svg>