<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Two large star-shaped pupils inside white oval scleras -->
  <ellipse cx="70" cy="100" rx="35" ry="40" fill="#FFFFFF" class="stroke"/>
  <ellipse cx="130" cy="100" rx="35" ry="40" fill="#FFFFFF" class="stroke"/>
  <!-- Star-shaped pupils (using polygon) -->
  <polygon points="70,72 76,88 93,88 80,98 84,115 70,104 56,115 60,98 47,88 64,88" fill="#FFD700" class="stroke"/>
  <polygon points="130,72 136,88 153,88 140,98 144,115 130,104 116,115 120,98 107,88 124,88" fill="#FFD700" class="stroke"/>
  <!-- Sparkle highlight dots -->
  <circle cx="65" cy="88" r="3" fill="#FFFFFF"/>
  <circle cx="125" cy="88" r="3" fill="#FFFFFF"/>
  <!-- Cute eyebrows above -->
  <path d="M 40 55 Q 70 40 100 55" fill="none" class="stroke"/>
  <path d="M 100 55 Q 130 40 160 55" fill="none" class="stroke"/>
  <!-- Extra sparkles -->
  <circle cx="50" cy="130" r="2" fill="#FFD700"/>
  <circle cx="150" cy="130" r="2" fill="#FFD700"/>
  <circle cx="100" cy="145" r="3" fill="#FFD700"/>
</svg>