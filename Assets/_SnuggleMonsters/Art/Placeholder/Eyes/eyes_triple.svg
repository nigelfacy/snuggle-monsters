<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Three circular eyes in a horizontal row -->
  <!-- Left eye (big pupil) -->
  <circle cx="60" cy="100" r="28" fill="#FFFFFF" class="stroke"/>
  <circle cx="60" cy="100" r="16" fill="#000000"/>
  <circle cx="55" cy="93" r="4" fill="#FFFFFF"/>
  <!-- Middle eye (medium pupil) -->
  <circle cx="100" cy="100" r="28" fill="#FFFFFF" class="stroke"/>
  <circle cx="100" cy="100" r="12" fill="#000000"/>
  <circle cx="96" cy="95" r="3" fill="#FFFFFF"/>
  <!-- Right eye (small pupil) -->
  <circle cx="140" cy="100" r="28" fill="#FFFFFF" class="stroke"/>
  <circle cx="140" cy="100" r="8" fill="#000000"/>
  <circle cx="137" cy="96" r="2" fill="#FFFFFF"/>
  <!-- Eyebrows -->
  <path d="M 38 65 Q 60 55 82 65" fill="none" class="stroke"/>
  <path d="M 82 65 Q 100 55 118 65" fill="none" class="stroke"/>
  <path d="M 118 65 Q 140 55 162 65" fill="none" class="stroke"/>
</svg>