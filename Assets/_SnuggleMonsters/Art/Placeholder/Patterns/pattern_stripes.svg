<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Three horizontal thick colour stripes -->
  <rect x="10" y="10" width="180" height="180" rx="15" ry="15" fill="#FFFFFF" class="stroke"/>
  <rect x="10" y="20" width="180" height="50" rx="10" ry="10" fill="#FF3B8D" class="stroke"/>
  <rect x="10" y="75" width="180" height="50" rx="10" ry="10" fill="#00E5FF" class="stroke"/>
  <rect x="10" y="130" width="180" height="50" rx="10" ry="10" fill="#FFD700" class="stroke"/>
</svg>