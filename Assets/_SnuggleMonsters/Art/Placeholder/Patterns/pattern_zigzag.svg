<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .stroke { stroke: #000000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Zigzag chevron pattern in alternating colours -->
  <rect x="10" y="10" width="180" height="180" rx="20" ry="20" fill="#FFFFFF" class="stroke"/>
  <!-- Purple and yellow zigzags -->
  <polygon points="10,40 60,10 110,40 160,10 210,40" fill="#9B59B6" class="stroke" clip-path="url(#clip)"/>
  <polygon points="10,70 60,40 110,70 160,40 210,70" fill="#FFD700" class="stroke" clip-path="url(#clip)"/>
  <polygon points="10,100 60,70 110,100 160,70 210,100" fill="#9B59B6" class="stroke" clip-path="url(#clip)"/>
  <polygon points="10,130 60,100 110,130 160,100 210,130" fill="#FFD700" class="stroke" clip-path="url(#clip)"/>
  <polygon points="10,160 60,130 110,160 160,130 210,160" fill="#9B59B6" class="stroke" clip-path="url(#clip)"/>
  <polygon points="10,190 60,160 110,190 160,160 210,190" fill="#FFD700" class="stroke" clip-path="url(#clip)"/>
  <clipPath id="clip">
    <rect x="10" y="10" width="180" height="180" rx="20"/>
  </clipPath>
</svg>