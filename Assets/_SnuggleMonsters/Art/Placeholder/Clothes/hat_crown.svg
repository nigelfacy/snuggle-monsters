<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Crown - Gold/yellow with 3 rounded points and jewel dots -->
  <!-- Crown base band -->
  <rect x="35" y="130" width="130" height="30" rx="6" fill="#FFD700" stroke="#000000" stroke-width="3"/>
  <!-- Left point -->
  <path d="M45,130 L35,50 L70,100 L85,130 Z" fill="#FFD700" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Centre point (tallest) -->
  <path d="M85,130 L82,130 L75,70 L100,30 L125,70 L118,130 Z" fill="#FFD700" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right point -->
  <path d="M115,130 L130,100 L165,50 L155,130 Z" fill="#FFD700" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <!-- Jewels -->
  <!-- Red jewel left -->
  <circle cx="55" cy="80" r="8" fill="#FF4444" stroke="#000000" stroke-width="2.5"/>
  <!-- Blue jewel centre -->
  <circle cx="100" cy="50" r="10" fill="#4488FF" stroke="#000000" stroke-width="2.5"/>
  <!-- Green jewel right -->
  <circle cx="145" cy="80" r="8" fill="#44CC44" stroke="#000000" stroke-width="2.5"/>
  <!-- Bottom band jewels -->
  <circle cx="60" cy="145" r="5" fill="#FF4444" stroke="#000000" stroke-width="2"/>
  <circle cx="100" cy="145" r="5" fill="#4488FF" stroke="#000000" stroke-width="2"/>
  <circle cx="140" cy="145" r="5" fill="#44CC44" stroke="#000000" stroke-width="2"/>
</svg>