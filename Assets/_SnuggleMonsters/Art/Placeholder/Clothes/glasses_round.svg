<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Round Glasses - Two large wireframe circles with bridge -->
  <!-- Left lens -->
  <circle cx="72" cy="100" r="42" fill="none" stroke="#00E5FF" stroke-width="5"/>
  <!-- Right lens -->
  <circle cx="128" cy="100" r="42" fill="none" stroke="#00E5FF" stroke-width="5"/>
  <!-- Bridge between lenses -->
  <path d="M114,95 C115,90 115,90 114,95" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round"/>
  <path d="M86,95 C85,90 85,90 86,95" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round"/>
  <line x1="86" y1="95" x2="114" y2="95" stroke="#00E5FF" stroke-width="5" stroke-linecap="round"/>
  <!-- Left temple arm -->
  <path d="M30,90 C25,88 15,85 10,88" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round"/>
  <!-- Right temple arm -->
  <path d="M170,90 C175,88 185,85 190,88" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round"/>
  <!-- Small shine highlights -->
  <ellipse cx="55" cy="80" rx="6" ry="3" fill="rgba(255,255,255,0.4)" transform="rotate(-20,55,80)"/>
  <ellipse cx="111" cy="80" rx="6" ry="3" fill="rgba(255,255,255,0.4)" transform="rotate(-20,111,80)"/>
</svg>